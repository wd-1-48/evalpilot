const group=document.createElement('div');group.className='fields';fields.forEach((f,i)=>{const label=document.createElement('label');label.textContent=['姓名数组','公司数组','地点数组'][i];const ta=document.createElement('textarea');ta.value=JSON.stringify(r['reference_'+f]);ta.setAttribute('aria-label',r.event_id+' '+label.textContent);ta.oninput=()=>{r.review_status='pending';status.value='pending';try{let a=JSON.parse(ta.value);if(!Array.isArray(a)||a.some(x=>typeof x!=='string'||!x.trim())||new Set(a).size!==a.length)throw Error();r['reference_'+f]=a;ta.setCustomValidity('');message('')}catch{ta.setCustomValidity('请输入不重复的字符串数组，例如 ["林沐"]，没有实体填 []');message(r.event_id+'：实体数组格式需修正')}progress()};label.append(ta);group.append(label)});card.append(group);
const why=document.createElement('p');why.textContent='建议依据：'+r.rationale;card.append(why);
const original=document.createElement('details'),summary=document.createElement('summary'),text=document.createElement('p');summary.textContent='查看原始 AI 建议（保留用于比较）';text.textContent=fields.map((f,i)=>['姓名','公司','地点'][i]+'：'+JSON.stringify(r['suggested_'+f])).join('；');original.append(summary,text);card.append(original);
const line=document.createElement('div');line.className='status';const status=document.createElement('select');for(const [v,t] of [['pending','待审核'],['approved','已确认'],['needs_discussion','需讨论']]){const opt=document.createElement('option');opt.value=v;opt.textContent=t;status.append(opt)}status.value=r.review_status;status.setAttribute('aria-label',r.event_id+' 审核状态');status.onchange=()=>{if(![...group.querySelectorAll('textarea')].every(t=>t.checkValidity())){status.value='pending';message('先修正数组格式');return}r.review_status=status.value;progress()};const reviewer=document.createElement('input');reviewer.placeholder='审核人';reviewer.value=r.reviewer;reviewer.setAttribute('aria-label',r.event_id+' 审核人');reviewer.oninput=()=>r.reviewer=reviewer.value;line.append(status,reviewer);card.append(line);const note=document.createElement('textarea');note.className='note';note.placeholder='修改理由、疑问或口径调整';note.value=r.review_note;note.setAttribute('aria-label',r.event_id+' 审核备注');note.oninput=()=>r.review_note=note.value;card.append(note);el('cards').append(card)}progress()}
el('filter').onchange=()=>{if([...document.querySelectorAll('textarea')].some(t=>!t.checkValidity())){message('请先修正当前数组格式再筛选');return}render()};
el('download').onclick=()=>{if([...document.querySelectorAll('textarea')].some(t=>!t.checkValidity()))return message('请先修正数组格式再导出');if(rows.some(r=>r.review_status==='approved'&&!r.reviewer.trim()))return message('已确认案例需要填写审核人');const payload={dataset_version:'public-candidates-v1',exported_at:new Date().toISOString(),label_source:'AI suggestions with explicit user review states',records:rows};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='evalpilot-human-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);message('已导出当前进度，请保管下载文件。')};
el('restore').onchange=async()=>{try{const file=el('restore').files[0];if(!file)return;if(file.size>2*1024*1024)throw Error();const d=JSON.parse(await file.text());if(d.dataset_version!=='public-candidates-v1'||!Array.isArray(d.records)||d.records.length!==seeds.length||new Set(d.records.map(r=>r.event_id)).size!==seeds.length)throw Error();const incoming=new Map(d.records.map(r=>[r.event_id,r]));const restored=seeds.map(seed=>{const r=incoming.get(seed.event_id);if(!r||r.description!==seed.description||!['pending','approved','needs_discussion'].includes(r.review_status)||typeof r.reviewer!=='string'||typeof r.review_note!=='string'||fields.some(f=>!Array.isArray(r['reference_'+f])||r['reference_'+f].some(x=>typeof x!=='string'||!x.trim())||new Set(r['reference_'+f]).size!==r['reference_'+f].length))throw Error();return {...seed,...Object.fromEntries(fields.map(f=>['reference_'+f,r['reference_'+f]])),review_status:r.review_status,reviewer:r.reviewer,review_note:r.review_note}});rows=restored;render();message('已恢复审核进度，原始建议保持不变')}catch{message('文件不是本批次有效审核结果，未覆盖当前进度')}};
window.addEventListener('beforeunload',e=>{if(rows.some(r=>r.review_status!=='pending'||r.review_note||r.reviewer||fields.some(f=>JSON.stringify(r['reference_'+f])!==JSON.stringify(r['suggested_'+f])))){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
